aid: gemnote
name: Gemnote
description: >-
  Gemnote is a corporate gifting and swag management platform that helps businesses
  design, produce, warehouse, and ship custom branded merchandise and gifts worldwide.
  Founded in 2014 and based in Union City, California, and backed by Y Combinator,
  Gemnote pairs a swag management app (inventory, order tracking, e-commerce swag
  stores, and Shopify integration) with human design and fulfillment expertise, and
  is used by companies such as Reddit, Google, Airbnb, and Sephora for employee swag,
  new-hire kits, PR and influencer kits, event giveaways, and packaging. Gemnote also
  publishes a JSON:API-style REST API that lets partners list gifts and greeting cards,
  create shipments to recipients, and track fulfillment programmatically, with a
  sandbox environment for testing.
